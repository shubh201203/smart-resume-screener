services:
  - type: web
    name: smart-resume-screener-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL_NAME
        value: gpt-4o-mini
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
    healthCheckPath: /health
